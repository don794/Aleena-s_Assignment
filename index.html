<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome - Aleena Bilal</title>
  <style>
    body 
    {
      font-family: Georgia, 'Times New Roman', Times, serif; /* updated font */
      background: linear-gradient(135deg, #191717, #2e0854);
      color: #eee;
      display: flex;
      text-align: center;
      margin: 0;
      padding: 0;
      height: 100vh; /* full viewport height */
      flex-direction: column;
      justify-content: center;
      align-items: center;


    }

    h1 {
      font-size: 36px;
      color: #a785c9;
      margin-bottom: 40px;
      text-shadow: 0 0 10px #a785c9;
    }

    .btn-box {
      display: flex;
      gap: 30px;
    }

    a {
      text-decoration: none;
      background: #66299c;
      color: #fff;
      padding: 15px 40px;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.3s;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    a:hover {
      background: #a64dff;
      transform: scale(1.05);
      text-shadow: 0 0 8px #fff;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #66299c;
      width: 100%;
      color: #aaa;
      text-align: center;
      margin-bottom: none;
      padding: 10px 0;
      font-size: small;
    }
   footer:hover {
      text-shadow: 0 0 10px #a64dff;
    }
  </style>
</head>
<body>
  <h1>Welcome to Aleena Bilal’s Assignment Portal</h1>

  </div>
