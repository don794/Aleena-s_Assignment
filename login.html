<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Aleena Bilal</title>
  <style>
    body {
      font-family: 'Georgia', 'Times New Roman', Times, serif;
      margin: 0;
      background: linear-gradient(135deg, #191717, #2e0854);
      color: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background:linear-gradient( #351551,black) #351551;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 15px 25px rgba(0,0,0,0.5);
      text-align: center;
      width: 300px;
    }
    h2 {
      margin-bottom: 20px;
      color: #efedf2;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      outline: none;
    }
    button {
      background: #460488;
      color: #fff;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #3a0047;
    }
    p {
      margin-top: 15px;
      color: #ddd;
    }
    a {
      color: #a64dff;
      text-decoration: none;
    }
    a:hover {
      text-shadow: 0 0 8px #a64dff;
    }
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #66299c;
      width: 100%;
      color: #aaa;
      text-align: center;
      margin-bottom: none;
      padding: 10px 0;
      font-size: small;
    }
   footer:hover {
      text-shadow: 0 0 10px #a64dff;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>
    <form action="dashboard.html">
      <input type="text" placeholder="Username" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Login</button>
     
    </form>
    <p>Not registered? <a href="register.html">Create an account</a></p>
  </div>
  <footer>
    &copy; 2026 Aleena Bilal. All rights reserved.  
  </footer>
</body>
</html>
